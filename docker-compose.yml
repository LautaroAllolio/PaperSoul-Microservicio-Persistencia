services:
  mongo:
    image: mongo:7
    container_name: papersoul-mongo
    restart: unless-stopped
    # Puerto ligado a loopback: el servicio NO tiene autenticación (SPEC.md §1.1 D-3).
    # Exponerlo en 0.0.0.0 publicaría la base de datos a toda la red local.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0
    container_name: papersoul-mongo-express
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASENAME: papersoul
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
